<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Snack Box</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Baloo 2', cursive;
  background: linear-gradient(135deg, #ffecd2, #fcb69f);
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 3rem;
  color: #ff3d81;
}

button {
  font-family: inherit;
  background: #ff3d81;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 1rem;
}

.snacks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.snack {
  background: white;
  border-radius: 25px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 8px 15px rgba(0,0,0,0.15);
  cursor: grab;
}

.snack img {
  width: 100px;
  height: 100px;
  object-fit: contain;
}

.cart {
  margin-top: 30px;
  background: #fff;
  border-radius: 30px;
  padding: 20px;
}

.cart-items {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.total {
  font-size: 1.4rem;
  margin-top: 15px;
  color: #ff3d81;
}

.notice {
  color: red;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>Build Your Snack Box 🍬</h1>

<div style="text-align:center;">
  <button onclick="addAll()">Add All Snacks</button>
</div>

<div class="snacks">
  <div class="snack" draggable="true" data-name="Chips" data-price="1.99">
    <img src="https://via.placeholder.com/100?text=Chips">
    <p>Chips<br>$1.99</p>
  </div>

  <div class="snack" draggable="true" data-name="Cookies" data-price="2.49">
    <img src="https://via.placeholder.com/100?text=Cookies">
    <p>Cookies<br>$2.49</p>
  </div>

  <div class="snack" draggable="true" data-name="Fruit Snacks" data-price="1.79">
    <img src="https://via.placeholder.com/100?text=Fruit">
    <p>Fruit Snacks<br>$1.79</p>
  </div>

  <div class="snack" draggable="true" data-name="Granola Bar" data-price="2.29">
    <img src="https://via.placeholder.com/100?text=Granola">
    <p>Granola Bar<br>$2.29</p>
  </div>
</div>

<div class="cart" id="cart">
  <h2>Your Snack Box (Max 6)</h2>
  <div class="cart-items" id="cartItems"></div>
  <div class="total" id="total">$0.00</div>
  <div class="notice" id="notice"></div>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
const snacks = document.querySelectorAll('.snack');
const cartItems = document.getElementById('cartItems');
const totalEl = document.getElementById('total');
const notice = document.getElementById('notice');

let total = 0;
let count = 0;
const maxItems = 6;

snacks.forEach(snack => {
  snack.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text', JSON.stringify({
      name: snack.dataset.name,
      price: snack.dataset.price
    }));
  });

  snack.addEventListener('click', () => {
    addItem(snack.dataset.name, snack.dataset.price);
  });
});

cart.addEventListener('dragover', e => e.preventDefault());

cart.addEventListener('drop', e => {
  e.preventDefault();
  const data = JSON.parse(e.dataTransfer.getData('text'));
  addItem(data.name, data.price);
});

function addItem(name, price) {
  if (count >= maxItems) {
    notice.innerText = "Your box is full!";
    return;
  }

  notice.innerText = "";
  count++;
  total += parseFloat(price);

  const item = document.createElement('div');
  item.innerText = name;
  cartItems.appendChild(item);

  totalEl.innerText = `$${total.toFixed(2)}`;
}

function addAll() {
  snacks.forEach(snack => {
    addItem(snack.dataset.name, snack.dataset.price);
  });
}

function checkout() {
  alert("Checkout ready! Stripe can be connected next.");
}
</script>

</body>
</html>
